[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contractlens"
version = "0.1.0"
description = "LLM-assisted legal contract review: clause classification, playbook risk scoring, redlines and cited Q&A."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Hassan" }]
keywords = ["llm", "legal-ai", "contract-review", "rag", "claude", "nlp", "cuad"]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pdfplumber>=0.11",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "scikit-learn>=1.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
ui = ["streamlit>=1.36"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4", "ruff>=0.5"]
all = ["contractlens[claude,openai,api,ui,dev]"]

[project.scripts]
contractlens = "contractlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contractlens = ["playbooks/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["B008", "E501"]  # FastAPI File()/Form() defaults are the documented pattern; long regexes stay on one line
